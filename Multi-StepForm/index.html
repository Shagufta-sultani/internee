<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Step Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">
        <div class="progress-con">
            <div class="progress-bar"></div>
         </div>
        <form action="" class="form">
            <div class="step">
                <input type="text" name="name" id="name" placeholder="Enter Your Name" ><br>
            <input type="email" name="email" id="email" placeholder="Enter Your Email"><br>
             <button type="button" class="next">Next</button>
            </div>
            <div class="step active ">
                <input type="text" id="number" name="number"  placeholder="Enter Your CNIC" ><br>
                <input type="number" id="num" name="number"  placeholder="Mobile Number" ><br>
                <button type="button" class="prev">Previous</button>
                <button type="button" class="next">Next</button>
            </div>
            <div class="step">
                <input type="password" name="password" id="password" placeholder="Password" ><br>
                <input type="password" name="password" id="Cpassword" placeholder="Confirm Password" ><br>
                <button type="button" class="prev">Previous</button>
               <button type="button" class="next">Next</button>
            </div>
            <div class="step">
                <div class="summary"></div>
                <button class="prev" >Previous</button>
                <button type="submit" class="submit" placeholder="Submit">Submit</button>
            </div>
        </form>      
    </section>
    <script src="main.js"></script>
</body>
</html>
